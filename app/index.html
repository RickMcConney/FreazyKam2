<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Browser-based CNC CAM for makers and woodworkers. Import or draw 2D vectors, set up stock and tools, generate and simulate toolpaths, and export G-code — all locally, no account or install."
    />
    <meta name="theme-color" content="#171717" />
    <link rel="canonical" href="https://freazykam.com/app/" />
    <title>FreazyKam — CNC CAM in the browser</title>

    <!-- This is the APP entry, served at /app/. The landing page is the root index.html.
         Link previews: og:image must be an ABSOLUTE url — crawlers do not resolve it
         against the page, and Vite's base is not applied inside a plain <meta>, so the
         site root is spelled out here rather than written "./". -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FreazyKam" />
    <meta property="og:url" content="https://freazykam.com/app/" />
    <meta property="og:title" content="FreazyKam — CNC CAM in the browser" />
    <meta
      property="og:description"
      content="Import or draw 2D vectors, set up stock and tools, generate and simulate toolpaths, and export G-code — all in the browser."
    />
    <meta property="og:image" content="https://freazykam.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FreazyKam — CNC CAM in the browser" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- BOOT WATCHDOG. If the module graph fails to load (a request lost while the machine
         wakes — the dev server's own reload after sleep is the case that was seen), main.tsx
         never runs, so nothing in the app can report it and the page just stays white. This
         plain script runs first: it records the failure in the same crash log the app keeps
         (src/util/crashLog.ts) and, if the app has still not drawn anything ten seconds after
         the page loaded, says so and offers a reload. React clears #root when it mounts, so a
         slow boot that does finish removes the notice by itself. -->
    <script>
      (function () {
        var failed = [];
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) failed.push(t.src || t.href);
        }, true);
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (!root || root.childElementCount > 0) return;
            try {
              var log = JSON.parse(localStorage.getItem('fkam.crashLog') || '[]');
              log.push({ at: new Date().toISOString(), source: 'boot',
                message: 'The app did not start' + (failed.length ? ' — failed to load: ' + failed.join(', ') : ''),
                visibility: document.visibilityState, hiddenForS: null, sinceVisibleS: null });
              localStorage.setItem('fkam.crashLog', JSON.stringify(log.slice(-20)));
            } catch (_) {}
            root.innerHTML = '<div style="font:14px system-ui;padding:24px;max-width:40em">' +
              '<p><b>FreazyKam did not finish starting.</b> Part of it failed to load — often a ' +
              'connection that was not back yet after the computer slept. Reloading usually fixes it; ' +
              'your last autosave is offered back.</p>' +
              '<button onclick="location.reload()" style="padding:4px 12px">Reload</button></div>';
          }, 10000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
