<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="spin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <pattern id="wood" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="8" height="8" fill="#e9c99a"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d4ad75" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="760" height="360" fill="#ffffff"/>

  <!-- ===================== CLIMB ===================== -->
  <g>
    <text x="180" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#15803d">Climb</text>
    <text x="180" y="48" text-anchor="middle" font-size="13" fill="#374151">wood on the RIGHT of the direction of travel</text>

    <!-- feed arrow, on the open (already cut) side -->
    <line x1="60" y1="84" x2="300" y2="84" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="180" y="76" text-anchor="middle" font-size="13" fill="#1f2937">tool moves this way</text>
    <text x="60" y="122" font-size="12" fill="#6b7280">already cut</text>

    <!-- stock: wall left behind the tool, uncut wood ahead of it -->
    <polygon points="20,220 180,220 180,170 340,170 340,300 20,300" fill="url(#wood)" stroke="#a16207" stroke-width="1.5"/>
    <text x="300" y="285" text-anchor="end" font-size="13" font-weight="600" fill="#78350f">wood</text>

    <!-- tool -->
    <circle cx="180" cy="170" r="50" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
    <circle cx="180" cy="170" r="3" fill="#4b5563"/>

    <!-- chip: thick where the tooth goes in, thin where it comes out -->
    <path d="M230,170 A50,50 0 0 1 169,218.8 A50,50 0 0 0 208,170 Z" fill="#dc2626" opacity="0.85"/>

    <!-- spindle rotation (clockwise, seen from above) -->
    <path d="M116,170 A64,64 0 0 1 180,106" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#spin)"/>
    <text x="104" y="140" text-anchor="end" font-size="12" fill="#2563eb">spindle</text>
    <text x="104" y="154" text-anchor="end" font-size="12" fill="#2563eb">turns ↻</text>

    <!-- labels on the chip -->
    <line x1="232" y1="182" x2="262" y2="200" stroke="#991b1b" stroke-width="1.2"/>
    <text x="264" y="204" font-size="13" font-weight="700" fill="#991b1b">tooth bites in</text>
    <text x="264" y="219" font-size="13" font-weight="700" fill="#991b1b">THICK</text>
    <line x1="168" y1="222" x2="132" y2="244" stroke="#991b1b" stroke-width="1.2"/>
    <text x="128" y="250" text-anchor="end" font-size="13" fill="#991b1b">leaves</text>
    <text x="128" y="265" text-anchor="end" font-size="13" fill="#991b1b">thin</text>

    <text x="180" y="330" text-anchor="middle" font-size="13" fill="#374151">Clean edge. The usual choice on a router.</text>
  </g>

  <line x1="380" y1="20" x2="380" y2="340" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ===================== CONVENTIONAL ===================== -->
  <g transform="translate(380,0)">
    <text x="180" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">Conventional</text>
    <text x="180" y="48" text-anchor="middle" font-size="13" fill="#374151">wood on the LEFT of the direction of travel</text>

    <!-- stock: mirror image, wood above the tool -->
    <polygon points="20,70 340,70 340,170 180,170 180,120 20,120" fill="url(#wood)" stroke="#a16207" stroke-width="1.5"/>
    <text x="300" y="92" text-anchor="end" font-size="13" font-weight="600" fill="#78350f">wood</text>

    <!-- tool -->
    <circle cx="180" cy="170" r="50" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
    <circle cx="180" cy="170" r="3" fill="#4b5563"/>

    <!-- chip: thin where the tooth goes in, thick where it comes out -->
    <path d="M230,170 A50,50 0 0 0 169,121.2 A50,50 0 0 1 208,170 Z" fill="#dc2626" opacity="0.85"/>

    <!-- spindle rotation (same direction: clockwise) -->
    <path d="M180,234 A64,64 0 0 1 116,170" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#spin)"/>
    <text x="104" y="196" text-anchor="end" font-size="12" fill="#2563eb">spindle</text>
    <text x="104" y="210" text-anchor="end" font-size="12" fill="#2563eb">turns ↻</text>

    <!-- labels on the chip -->
    <line x1="166" y1="118" x2="132" y2="138" stroke="#991b1b" stroke-width="1.2"/>
    <text x="128" y="138" text-anchor="end" font-size="13" fill="#991b1b">tooth starts</text>
    <text x="128" y="153" text-anchor="end" font-size="13" fill="#991b1b">thin, rubs</text>
    <line x1="232" y1="160" x2="262" y2="146" stroke="#991b1b" stroke-width="1.2"/>
    <text x="264" y="143" font-size="13" font-weight="700" fill="#991b1b">leaves</text>
    <text x="264" y="158" font-size="13" font-weight="700" fill="#991b1b">THICK</text>

    <!-- feed arrow, on the open side -->
    <text x="60" y="230" font-size="12" fill="#6b7280">already cut</text>
    <line x1="60" y1="270" x2="300" y2="270" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="180" y="292" text-anchor="middle" font-size="13" fill="#1f2937">tool moves this way</text>

    <text x="180" y="330" text-anchor="middle" font-size="13" fill="#374151">Rougher edge. Forgiving of backlash.</text>
  </g>
</svg>
